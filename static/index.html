<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 24px;
            font-size: 28px;
        }

        /* Upload Panel */
        .upload-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: none;
        }

        .upload-card h3 {
            font-size: 16px;
            color: #444;
            margin-bottom: 12px;
        }

        .upload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            /* Creates blank space below the header row */
        }

        .upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="file"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .common_button {
            padding: 10px 22px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .common_button:hover {
            background: #0056b3;
        }

        .common_button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #uploadStatus {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

        /* Chat Panel */
        .chat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        #chat {
            height: 420px;
            overflow-y: auto;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #e9ecef;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .sources {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #q {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        #q:focus {
            border-color: #007bff;
        }

        #sendBtn {
            padding: 14px 28px;
            font-size: 15px;
        }

        .widget-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-bottom: 13px;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        #clearStatus {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        .text-right {
            text-align: right;
            width: 100%;
            /* Ensures the container spans full width to allow right-alignment */
        }

        .link-button {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font: inherit;
            /* Inherits the font size/family from its parent container */
            color: #0066cc;
            /* Standard link blue color */
            text-decoration: underline;
            cursor: pointer;
        }

        /* Optional: change appearance on hover */
        .link-button:hover {
            color: #004499;
            text-decoration: none;
            /* Removes underline on hover, or vice-versa */
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 RAG Chatbot</h1>
        <div class="widget-wrapper">
            <div class="button-container">
                <button id="show_upload" class="common_button" onclick="showUpload(true)">Upload</button>
                <button id="clear_db" class="common_button" onclick="clearDB()">Clear</button>
            </div>
            <div id="clearStatus"></div>
        </div>

        <div class="upload-card">
            <div class="upload-header">
                <h3>Upload Document</h3>
                <button class="link-button" onclick="showUpload(false)">Back</button>
            </div>
            <div class="upload-row">
                <input type="file" id="fileInput" accept=".txt,.pdf" multiple>
                <button id="uploadBtn" class="common_button" onclick="uploadFile()">Upload</button>
            </div>
            <div id="uploadStatus"></div>
        </div>

        <div class="chat-card">
            <div id="chat"></div>
            <div class="input-row">
                <input id="q" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') send()">
                <button id="sendBtn" class="common_button" onclick="send()">Send</button>
            </div>
        </div>
    </div>

    <script>
        function showUpload(status) {
            const navigetBox = document.querySelectorAll(".widget-wrapper");
            const uploadCard = document.querySelectorAll('.upload-card');
            uploadCard.forEach(el => {
                el.style.display = status === true ? "block" : "none";
            });
            navigetBox.forEach(el => {
                el.style.display = status === true ? "none" : "flex";
            });
        }

        async function clearDB() {
            const clearStatus = document.getElementById('clearStatus');
            const show_up_btn = document.getElementById('show_upload');
            const clear_btn = document.getElementById('clear_db');

            show_up_btn.disabled = true;
            clear_btn.disabled = true;

            clearStatus.textContent = 'Clear data...';
            clearStatus.className = '';

            try {
                const res = await fetch('/db-clear', { method: 'DELETE' });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error('Failed to clear database');
                }

                const results = data.results || [];

                const success = results.filter(r => !r.error);
                const failed = results.filter(r => r.error);

                console.log('Success : ', success);
                console.log('Faild : ', failed);
                

                clearStatus.innerHTML = `
            ${success.length ? `
                <div class="success">
                    ${success.map(f => `${f.msg}`).join('<br><br>')}
                </div>
            ` : ''}
            ${failed.length ? `
                <div class="error">
                    ${failed.map(f => `${f.error}`).join('<br><br>')}
                </div>
            ` : ''}`;

            } catch (e) {
                clearStatus.textContent = e.message || 'Clear process failed';
                clearStatus.className = 'error';
            } finally {
                show_up_btn.disabled = false;
                clear_btn.disabled = false;
            }
        }

        async function send() {
            const chat = document.getElementById('chat');
            const qInput = document.getElementById('q');
            const question = qInput.value.trim();
            if (!question) return;

            // User message
            chat.innerHTML += `<div class="msg user">${escapeHtml(question)}</div>`;
            qInput.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Bot placeholder
            const botMsg = document.createElement('div');
            botMsg.className = 'msg bot';
            botMsg.innerHTML = '<em style="color:#999">Thinking...</em>';
            chat.appendChild(botMsg);
            chat.scrollTop = chat.scrollHeight;

            // SSE stream
            const res = await fetch('/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let text = '';
            botMsg.textContent = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const lines = decoder.decode(value).split('\n');
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = JSON.parse(line.slice(6));

                    if (data.token) {
                        text += data.token;
                        botMsg.textContent = text;
                    }
                    if (data.sources && data.sources.length) {
                        const src = document.createElement('div');
                        src.className = 'sources';
                        src.textContent = '📚 ' + data.sources.join(', ');
                        botMsg.appendChild(src);
                    }
                }
                chat.scrollTop = chat.scrollHeight;
            }
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            const btn = document.getElementById('uploadBtn');
            const uploadStatus = document.getElementById('uploadStatus');

            if (!input.files.length) {
                uploadStatus.textContent = 'Select at least one file';
                uploadStatus.className = 'error';
                return;
            }

            const form = new FormData();

            for (const file of input.files) {
                form.append('files', file);
            }

            btn.disabled = true;
            uploadStatus.textContent = 'Uploading files...';
            uploadStatus.className = '';

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: form
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Upload failed');
                }

                const results = data.results || [];

                const successful = results.filter(r => !r.error);
                const failed = results.filter(r => r.error);

                uploadStatus.innerHTML = `
            <div class="success">
                ✅ ${successful.length} file(s) indexed successfully.
                Total chunks: ${successful.reduce((sum, f) => sum + f.chunks, 0)}
            </div>
            ${failed.length ? `
                <div class="error">
                    ${failed.map(f => `${f.filename}: ${f.error}`).join('<br><br>')}
                </div>
            ` : ''}`;

                if (successful.length) {
                    input.value = '';
                }

            } catch (e) {
                uploadStatus.textContent = e.message || 'Upload failed';
                uploadStatus.className = 'error';
            } finally {
                btn.disabled = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
