services:    
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb

    ports:
      - "7000:8000"

    volumes:
      - chroma_data:/data

    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data: